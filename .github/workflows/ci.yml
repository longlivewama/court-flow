name: CI

on:
  push:
    branches: [main]
  pull_request:

# Scope: backend type-checking + lint + unit tests (with the coverage gate),
# plus frontend type-checking + lint + build. This is the automated gate for
# the application-layer test coverage added alongside the Batch 1 security
# fixes, extended with a production-readiness pass that also gave the backend
# a working ESLint 9 flat config (previously missing entirely — `npm run
# lint` crashed outright rather than reporting anything), drove domain/
# application coverage from ~30% up past the existing threshold by adding
# tests for every previously-untested booking use case, and root-caused every
# frontend react-hooks/react-compiler violation (was ~35 errors, now 0).
#
# NOT yet gated (pre-existing tech debt, tracked separately — do not add here
# until fixed): no frontend test suite exists yet (typecheck/lint/build only).
jobs:
  backend:
    name: Backend — typecheck, lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (with coverage gate)
        run: npm test

  frontend:
    name: Frontend — typecheck, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npm run build
