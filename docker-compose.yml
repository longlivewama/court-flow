services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: courtflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       courtflow
      POSTGRES_USER:     courtflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtflow_pass}
      # Consumed by the zz_set_audit_writer_password.sh init hook to rotate the
      # audit_writer role off its migration placeholder. Must match the password
      # in the api service's DATABASE_URL_AUDIT below.
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-CHANGE_IN_PRODUCTION}
      # Consumed by the zz_set_courtflow_app_password.sh init hook to rotate the
      # courtflow_app role (migration 018) off its migration placeholder. Must
      # match the password in the api service's DATABASE_URL_APP below.
      COURTFLOW_APP_DB_PASSWORD: ${COURTFLOW_APP_DB_PASSWORD:-CHANGE_IN_PRODUCTION}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    # Bind to loopback only: the API reaches Postgres over the internal compose
    # network, so this host mapping is for local tooling and must never be
    # exposed on a public interface (it would bypass nginx/TLS/app auth).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: courtflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redisdata:/data
    # Loopback only (see the postgres note above) — internal traffic uses the
    # compose network; this mapping is for local debugging, not public exposure.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: courtflow_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      # Hardcoding this to `development` would force resolveSsl() (see
      # database/client.ts) to disable Postgres TLS verification unconditionally
      # — including for a real deployment that reuses this compose file with
      # production secrets injected via NODE_ENV. Defaulting (not hardcoding)
      # preserves today's local-dev behavior while letting production actually
      # set NODE_ENV=production and get real TLS enforcement.
      NODE_ENV:     ${NODE_ENV:-development}
      DATABASE_URL: postgresql://courtflow:${POSTGRES_PASSWORD:-courtflow_pass}@postgres:5432/courtflow
      # backend/.env points this at 127.0.0.1 (host-oriented); inside the container it must target the postgres service
      DATABASE_URL_AUDIT: postgresql://audit_writer:${AUDIT_DB_PASSWORD:-CHANGE_IN_PRODUCTION}@postgres:5432/courtflow?sslmode=disable
      # Non-superuser role (migration 018) for the app's day-to-day queries —
      # see client.ts. Keeps a compromised app process from being able to
      # bypass audit_logs' row-level security the way the superuser
      # `courtflow` connection above could.
      DATABASE_URL_APP: postgresql://courtflow_app:${COURTFLOW_APP_DB_PASSWORD:-CHANGE_IN_PRODUCTION}@postgres:5432/courtflow?sslmode=disable
      REDIS_URL:    redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379
      PORT:         4000
    volumes:
      - uploads:/app/uploads
      - ./backend/keys:/app/keys:ro
    # No host port publish: all external traffic must enter through nginx
    # (ports 80/443 below). Publishing 4000 here would let anyone on the host
    # network reach the API directly, bypassing nginx's TLS termination, rate
    # limiting, and security headers entirely. `expose` keeps the port
    # reachable to other containers on the compose network (nginx → api:4000)
    # without binding it on the host.
    expose:
      - "4000"

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin: the client bundle calls /api on whatever host served the
        # page, and nginx proxies /api → api:4000. Works for any deployment
        # domain without baking a hostname into the build.
        NEXT_PUBLIC_API_URL: /api
    container_name: courtflow_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: /api
    # Served through nginx (frontend:3000 on the compose network); no host port
    # publish so :3000 stays free for local `next dev`.
    expose:
      - "3000"

  # ── Nginx reverse proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: courtflow_nginx
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local
